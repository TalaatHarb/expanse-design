name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: --batch-mode --no-transfer-progress

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Java ${{ matrix.java }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        java: ['21', '25']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify
        shell: pwsh
        run: |
          $postgres = '${{ matrix.os }}' -eq 'ubuntu-latest' -and '${{ matrix.java }}' -eq '21'
          mvn clean verify "-Dexpanse.postgres.tests=$($postgres.ToString().ToLowerInvariant())" "-Dexpanse.source-revision=${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mvn dependency:list "-DincludeScope=runtime" "-DoutputFile=target/dependencies.txt"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-${{ matrix.os }}-java${{ matrix.java }}
          path: |
            **/target/surefire-reports/*
            **/target/dependencies.txt

  package:
    name: Package and smoke-test Windows portable
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build client + local-server jar
        id: build
        shell: bash
        run: |
          mvn -Pbundle-local-server -pl expanse-server,expanse-mcp,expanse-desktop -am -DskipTests -Dexpanse.source-revision=${{ github.sha }} package
          echo "version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> "$GITHUB_OUTPUT"
      - name: Build Windows portable zip
        shell: pwsh
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          $version = $env:VERSION
          ./.github/scripts/package-windows-portable.ps1 -Version $version `
            -DesktopJar "expanse-desktop/target/expanse-desktop-$version.jar" -OutputDirectory target/release -SmokeTest
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-packages
          retention-days: 7
          path: |
            target/release/*.zip
            expanse-desktop/target/expanse-desktop-*.jar
            expanse-server/target/expanse-server-*.jar
            expanse-mcp/target/expanse-mcp-*.jar
