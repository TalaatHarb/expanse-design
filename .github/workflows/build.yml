name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: --batch-mode --no-transfer-progress

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Java ${{ matrix.java }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        java: ['21', '25']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify
        shell: pwsh
        run: |
          $postgres = '${{ matrix.os }}' -eq 'ubuntu-latest' -and '${{ matrix.java }}' -eq '21'
          # dependency:list must run in the same invocation so sibling modules resolve from the reactor.
          mvn clean verify dependency:list "-DincludeScope=runtime" "-DoutputFile=target/dependencies.txt" "-Dexpanse.postgres.tests=$($postgres.ToString().ToLowerInvariant())" "-Dexpanse.source-revision=${{ github.sha }}"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-${{ matrix.os }}-java${{ matrix.java }}
          path: |
            **/target/surefire-reports/*
            **/target/dependencies.txt

  package:
    name: Package and smoke-test Windows portable
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build client + local-server jar
        id: build
        shell: bash
        run: |
          mvn -Pbundle-local-server -pl expanse-server,expanse-mcp,expanse-desktop -am -DskipTests -Dexpanse.source-revision=${{ github.sha }} package
          jar=$(ls expanse-desktop/target/expanse-desktop-*.jar | head -n 1)
          version=$(basename "$jar" .jar); version=${version#expanse-desktop-}
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build Windows portable zip
        shell: pwsh
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          $version = $env:VERSION
          ./.github/scripts/package-windows-portable.ps1 -Version $version `
            -DesktopJar "expanse-desktop/target/expanse-desktop-$version.jar" -OutputDirectory target/release -SmokeTest
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-packages
          retention-days: 7
          path: |
            target/release/*.zip
            expanse-desktop/target/expanse-desktop-*.jar
            expanse-server/target/expanse-server-*.jar
            expanse-mcp/target/expanse-mcp-*.jar

  docker:
    name: Docker image smoke test
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build server jar and Docker context
        run: |
          mvn -pl expanse-server -am -DskipTests -Dexpanse.source-revision=${{ github.sha }} package
          mkdir -p docker-context
          cp expanse-server/target/expanse-server-*.jar docker-context/expanse-server.jar
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: docker-context
          file: expanse-server/Dockerfile
          build-args: REVISION=${{ github.sha }}
          load: true
          tags: expanse-server:smoke
      - name: Smoke-test container
        run: bash .github/scripts/smoke-test-server-image.sh expanse-server:smoke