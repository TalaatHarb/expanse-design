server:
  address: 127.0.0.1
  port: 8765
  max-http-request-header-size: 16KB
spring:
  application:
    name: expanse-server
  datasource:
    url: jdbc:h2:file:${EXPANSE_DATA_DIR:${user.home}/.expanse-design}/projects;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 4
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
  flyway:
    enabled: true
# Anonymous liveness for clients and orchestrators: status only, never component details.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    java:
      enabled: true
# OpenAPI document at /v3/api-docs, Swagger UI at /swagger-ui.html. Disable with SPRINGDOC_API_DOCS_ENABLED=false
# and SPRINGDOC_SWAGGER_UI_ENABLED=false.
springdoc:
  paths-to-match: /api/v1/**
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
    operations-sorter: alpha
    tags-sorter: alpha
