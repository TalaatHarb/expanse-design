server:
  address: 127.0.0.1
  port: 8765
  max-http-request-header-size: 16KB
spring:
  application:
    name: expanse-server
  datasource:
    url: jdbc:h2:file:${EXPANSE_DATA_DIR:${user.home}/.expanse-design}/projects;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 4
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
  flyway:
    enabled: true
